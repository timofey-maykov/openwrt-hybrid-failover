# hybrid-failover: raise the UDP socket buffer ceiling so hysteria2/QUIC can
# request larger receive/send buffers under bursty traffic instead of being
# silently capped to OpenWrt's small default (172KiB), which increases
# packet loss / retransmits under load.
net.core.rmem_max = 4194304
net.core.wmem_max = 4194304
