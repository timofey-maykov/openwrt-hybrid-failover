<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hybrid Failover diagram</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#070b16;}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;}
  svg{width:1600px;height:1000px;display:block;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;}
  .mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;}
  .t{fill:#e8edf7;}
  .s{fill:#8b96b3;}
  .card{fill:url(#glass);stroke:#2a3350;stroke-width:1.2;}
  .cardT{font-size:15px;font-weight:600;fill:#e8edf7;}
  .cardS{font-size:11.5px;fill:#8b96b3;}
  .lbl{font-size:11px;fill:#9aa5c2;font-weight:500;letter-spacing:.06em;text-transform:uppercase;}
  .flow{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;}
  .data{stroke:#3fd0ff;}
  .ctl{stroke:#a78bfa;}
  .dns{stroke:#2dd4bf;}
  .vpn{stroke:#34d399;}
  .bak{stroke:#fbbf24;}
  .dash{stroke-dasharray:6 6;}
</style>
</head>
<body>
<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="55%" cy="45%" r="75%">
      <stop offset="0" stop-color="#101a33"/>
      <stop offset="0.6" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#060912"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#182140" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#111831" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="routerFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1730" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#0b1226" stop-opacity="0.75"/>
    </linearGradient>
    <linearGradient id="routerStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3fd0ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34d399"/><stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fbbf24"/><stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fd0ff"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/><stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="aData" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3fd0ff"/></marker>
    <marker id="aCtl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a78bfa"/></marker>
    <marker id="aDns" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2dd4bf"/></marker>
    <marker id="aVpn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#34d399"/></marker>
    <marker id="aBak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fbbf24"/></marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#grid)"/>
  <circle cx="1350" cy="120" r="260" fill="#a78bfa" fill-opacity="0.06"/>
  <circle cx="200" cy="820" r="240" fill="#3fd0ff" fill-opacity="0.05"/>

  <!-- title -->
  <text x="60" y="66" class="t" font-size="30" font-weight="800" letter-spacing="-0.5">Hybrid Failover</text>
  <text x="298" y="66" class="s" font-size="16" font-weight="500">how it works on OpenWrt</text>
  <text x="60" y="92" class="s" font-size="13">AmneziaWG VPN as the primary path, backup proxies via urltest, fakeip DNS, managed from LuCI and Telegram</text>

  <!-- ===================== CONTROL PLANE ===================== -->
  <text x="400" y="132" class="lbl">Management</text>

  <g filter="url(#soft)">
    <rect x="400" y="142" width="180" height="70" rx="14" class="card"/>
    <rect x="400" y="142" width="180" height="3" rx="1.5" fill="url(#violet)"/>
    <text x="420" y="172" class="cardT">LuCI</text>
    <text x="420" y="192" class="cardS">Services → Hybrid Failover</text>
  </g>
  <g filter="url(#soft)">
    <rect x="608" y="142" width="180" height="70" rx="14" class="card"/>
    <rect x="608" y="142" width="180" height="3" rx="1.5" fill="url(#violet)"/>
    <text x="628" y="172" class="cardT">Telegram bot</text>
    <text x="628" y="192" class="cardS">/panel · /health · alerts</text>
  </g>

  <!-- pending pill -->
  <g filter="url(#soft)">
    <rect x="830" y="142" width="240" height="70" rx="14" class="card"/>
    <rect x="830" y="142" width="240" height="3" rx="1.5" fill="url(#violet)"/>
    <text x="850" y="170" class="cardT">Pending changes</text>
    <g class="mono" font-size="11" fill="#c4b5fd">
      <text x="850" y="193">capture → validate → apply</text>
    </g>
  </g>

  <g filter="url(#soft)">
    <rect x="1112" y="142" width="180" height="70" rx="14" class="card"/>
    <rect x="1112" y="142" width="180" height="3" rx="1.5" fill="url(#violet)"/>
    <text x="1132" y="170" class="cardT">UCI</text>
    <text x="1132" y="192" class="cardS mono" font-size="11">/etc/config/hybrid-failover</text>
  </g>

  <!-- control arrows -->
  <path d="M490 212 V226 H1150 V218" class="flow ctl" marker-end="url(#aCtl)"/>
  <path d="M788 177 H824" class="flow ctl" marker-end="url(#aCtl)"/>
  <path d="M1070 177 H1106" class="flow ctl" marker-end="url(#aCtl)"/>
  <!-- UCI -> core -->
  <path d="M1202 212 V236" class="flow ctl" marker-end="url(#aCtl)"/>
  <text x="1214" y="230" class="s" font-size="11">core reads it on apply / start</text>

  <!-- ===================== ROUTER PANEL ===================== -->
  <rect x="380" y="240" width="860" height="670" rx="26" fill="url(#routerFill)" stroke="url(#routerStroke)" stroke-width="1.6"/>
  <text x="404" y="270" class="t" font-size="14" font-weight="700">OpenWrt router</text>
  <text x="530" y="270" class="s mono" font-size="12">/usr/sbin/hybrid-failover · native engine</text>

  <!-- column labels -->
  <text x="410" y="318" class="lbl">DNS</text>
  <text x="650" y="318" class="lbl">Traffic</text>
  <text x="960" y="318" class="lbl">Outbounds</text>

  <!-- ---- DNS column ---- -->
  <g filter="url(#soft)">
    <rect x="410" y="330" width="200" height="66" rx="14" class="card"/>
    <rect x="410" y="330" width="3" height="66" rx="1.5" fill="url(#teal)"/>
    <text x="430" y="357" class="cardT">dnsmasq</text>
    <text x="430" y="378" class="cardS mono" font-size="11">server=127.0.0.42</text>
  </g>
  <path d="M510 396 V434" class="flow dns" marker-end="url(#aDns)"/>
  <g filter="url(#soft)">
    <rect x="410" y="440" width="200" height="66" rx="14" class="card"/>
    <rect x="410" y="440" width="3" height="66" rx="1.5" fill="url(#teal)"/>
    <text x="430" y="467" class="cardT">Engine DNS</text>
    <text x="430" y="488" class="cardS mono" font-size="11">127.0.0.42:53</text>
  </g>
  <path d="M510 506 V544" class="flow dns" marker-end="url(#aDns)"/>
  <g filter="url(#soft)">
    <rect x="410" y="550" width="200" height="84" rx="14" class="card"/>
    <rect x="410" y="550" width="3" height="84" rx="1.5" fill="url(#teal)"/>
    <text x="430" y="577" class="cardT">fakeip + upstream</text>
    <text x="430" y="597" class="cardS mono" font-size="11">198.18.0.0/15</text>
    <text x="430" y="615" class="cardS">others via bootstrap DNS</text>
  </g>
  <!-- fakeip feeds engine -->
  <path d="M610 592 H630 V484 H644" class="flow dns dash" marker-end="url(#aDns)"/>

  <!-- rulesets -->
  <g filter="url(#soft)">
    <rect x="410" y="700" width="200" height="66" rx="14" class="card"/>
    <rect x="410" y="700" width="3" height="66" rx="1.5" fill="url(#teal)"/>
    <text x="430" y="727" class="cardT">Rulesets</text>
    <text x="430" y="748" class="cardS">community domain lists</text>
  </g>
  <path d="M510 766 V800" class="flow ctl" marker-start="url(#aCtl)"/>
  <g filter="url(#soft)">
    <rect x="410" y="806" width="200" height="66" rx="14" class="card"/>
    <rect x="410" y="806" width="3" height="66" rx="1.5" fill="url(#violet)"/>
    <text x="430" y="833" class="cardT">cron list-update</text>
    <text x="430" y="854" class="cardS">daily, auto apply</text>
  </g>
  <path d="M610 733 H630 V592" class="flow dns dash"/>

  <!-- ---- Traffic column ---- -->
  <g filter="url(#soft)">
    <rect x="650" y="330" width="250" height="84" rx="14" class="card"/>
    <rect x="650" y="330" width="3" height="84" rx="1.5" fill="url(#cyan)"/>
    <text x="670" y="356" class="cardT">nft tproxy</text>
    <text x="670" y="376" class="cardS mono" font-size="11">table inet hybrid_failover</text>
    <text x="670" y="394" class="cardS mono" font-size="11">mark 0x105 · port 1602</text>
  </g>
  <path d="M775 414 V438" class="flow data" marker-end="url(#aData)"/>

  <g filter="url(#soft)">
    <rect x="650" y="444" width="250" height="80" rx="14" class="card" stroke="#3fd0ff" stroke-opacity="0.7"/>
    <rect x="650" y="444" width="3" height="80" rx="1.5" fill="url(#cyan)"/>
    <text x="670" y="472" class="cardT">Native engine</text>
    <text x="670" y="492" class="cardS">rules by domain and subnet</text>
    <text x="670" y="510" class="cardS">per-client rules by LAN IP</text>
  </g>
  <path d="M775 524 V562" class="flow data" marker-end="url(#aData)"/>

  <g filter="url(#soft)">
    <rect x="650" y="568" width="250" height="66" rx="14" class="card"/>
    <rect x="650" y="568" width="3" height="66" rx="1.5" fill="url(#cyan)"/>
    <text x="670" y="595" class="cardT">Selector</text>
    <text x="670" y="615" class="cardS"><tspan class="mono">glob-out</tspan> · auto or manual pin</text>
  </g>
  <path d="M775 634 V694" class="flow data" marker-end="url(#aData)"/>
  <text x="787" y="668" class="s" font-size="11">default</text>

  <g filter="url(#soft)">
    <rect x="650" y="700" width="250" height="98" rx="14" class="card"/>
    <rect x="650" y="700" width="3" height="98" rx="1.5" fill="url(#cyan)"/>
    <text x="670" y="727" class="cardT">URLTest</text>
    <text x="670" y="747" class="cardS">probes generate_204 every 3 min</text>
    <text x="670" y="765" class="cardS">tolerance 50 ms, picks the live</text>
    <text x="670" y="783" class="cardS">and fastest channel</text>
  </g>

  <!-- ---- Outbounds column ---- -->
  <!-- primary AWG -->
  <g filter="url(#soft)">
    <rect x="960" y="330" width="250" height="90" rx="14" class="card" stroke="#34d399" stroke-opacity="0.8"/>
    <rect x="960" y="330" width="3" height="90" rx="1.5" fill="url(#green)"/>
    <text x="980" y="357" class="cardT">AmneziaWG</text>
    <rect x="1112" y="343" width="78" height="20" rx="10" fill="#34d399" fill-opacity="0.15" stroke="#34d399" stroke-opacity="0.6"/>
    <text x="1151" y="357" font-size="10.5" font-weight="700" fill="#34d399" text-anchor="middle">PRIMARY</text>
    <text x="980" y="380" class="cardS mono" font-size="11">glob-awg-out · direct via awg0</text>
    <text x="980" y="401" class="cardS">kmod-amneziawg 3.1, handshake</text>
  </g>
  <!-- backups -->
  <g filter="url(#soft)">
    <rect x="960" y="444" width="250" height="60" rx="14" class="card"/>
    <rect x="960" y="444" width="3" height="60" rx="1.5" fill="url(#amber)"/>
    <text x="980" y="470" class="cardT">VLESS</text>
    <text x="980" y="490" class="cardS">Reality, XTLS · <tspan class="mono">glob-1-out</tspan></text>
  </g>
  <g filter="url(#soft)">
    <rect x="960" y="518" width="250" height="60" rx="14" class="card"/>
    <rect x="960" y="518" width="3" height="60" rx="1.5" fill="url(#amber)"/>
    <text x="980" y="544" class="cardT">Shadowsocks / Trojan</text>
    <text x="980" y="564" class="cardS">udp over tcp · <tspan class="mono">glob-2-out</tspan></text>
  </g>
  <g filter="url(#soft)">
    <rect x="960" y="592" width="250" height="60" rx="14" class="card"/>
    <rect x="960" y="592" width="3" height="60" rx="1.5" fill="url(#amber)"/>
    <text x="980" y="618" class="cardT">Hysteria2</text>
    <text x="980" y="638" class="cardS">QUIC, obfs · <tspan class="mono">glob-3-out</tspan></text>
  </g>
  <g filter="url(#soft)">
    <rect x="960" y="666" width="250" height="60" rx="14" class="card"/>
    <rect x="960" y="666" width="3" height="60" rx="1.5" fill="url(#amber)"/>
    <text x="980" y="692" class="cardT">SOCKS</text>
    <text x="980" y="712" class="cardS">socks4 / 4a / 5 · <tspan class="mono">glob-4-out</tspan></text>
  </g>
  <text x="960" y="756" class="s" font-size="11.5">Links: vless:// ss:// trojan:// hy2:// socks5://</text>
  <text x="960" y="775" class="s" font-size="11.5">Amnezia vpn:// decodes to vless:// or awg2://</text>
  <text x="960" y="800" class="lbl" font-size="10">Backup</text>
  <rect x="1010" y="792" width="200" height="1" fill="#fbbf24" fill-opacity="0.35"/>

  <!-- urltest -> outbounds (fan out) -->
  <path d="M900 749 C 930 749, 925 375, 954 375" class="flow vpn" marker-end="url(#aVpn)"/>
  <path d="M900 749 C 930 749, 925 474, 954 474" class="flow bak dash" marker-end="url(#aBak)"/>
  <path d="M900 749 C 930 749, 925 548, 954 548" class="flow bak dash" marker-end="url(#aBak)"/>
  <path d="M900 749 C 930 749, 925 622, 954 622" class="flow bak dash" marker-end="url(#aBak)"/>
  <path d="M900 749 C 930 749, 925 696, 954 696" class="flow bak dash" marker-end="url(#aBak)"/>
  <circle cx="900" cy="749" r="5" fill="#3fd0ff" filter="url(#glow)"/>

  <!-- ===================== LAN CLIENTS ===================== -->
  <text x="80" y="318" class="lbl">LAN clients</text>
  <g filter="url(#soft)">
    <rect x="80" y="330" width="200" height="60" rx="14" class="card"/>
    <text x="104" y="366" font-size="22">📱</text>
    <text x="140" y="357" class="cardT">Phone</text>
    <text x="140" y="376" class="cardS">Wi-Fi</text>
  </g>
  <g filter="url(#soft)">
    <rect x="80" y="404" width="200" height="60" rx="14" class="card"/>
    <text x="104" y="440" font-size="22">💻</text>
    <text x="140" y="431" class="cardT">Laptop</text>
    <text x="140" y="450" class="cardS">Wi-Fi / Ethernet</text>
  </g>
  <g filter="url(#soft)">
    <rect x="80" y="478" width="200" height="60" rx="14" class="card"/>
    <text x="104" y="514" font-size="22">📺</text>
    <text x="140" y="505" class="cardT">TV</text>
    <text x="140" y="524" class="cardS">per-client rules</text>
  </g>
  <g filter="url(#soft)">
    <rect x="80" y="552" width="200" height="60" rx="14" class="card"/>
    <text x="104" y="588" font-size="22">🎮</text>
    <text x="140" y="579" class="cardT">Console</text>
    <text x="140" y="598" class="cardS">UDP via AWG</text>
  </g>
  <text x="80" y="640" class="s" font-size="11.5">Nothing to configure on devices.</text>
  <text x="80" y="657" class="s" font-size="11.5">The router decides where traffic goes.</text>

  <!-- LAN bus -->
  <rect x="318" y="292" width="4" height="320" rx="2" fill="#3fd0ff" fill-opacity="0.35"/>
  <path d="M280 360 H316" class="flow data" stroke-opacity="0.6"/>
  <path d="M280 434 H316" class="flow data" stroke-opacity="0.6"/>
  <path d="M280 508 H316" class="flow data" stroke-opacity="0.6"/>
  <path d="M280 582 H316" class="flow data" stroke-opacity="0.6"/>
  <!-- bus -> dnsmasq (DNS) and -> tproxy (traffic) -->
  <path d="M322 363 H404" class="flow dns" marker-end="url(#aDns)"/>
  <text x="330" y="352" fill="#2dd4bf" font-size="10.5" font-weight="600">DNS :53</text>
  <path d="M322 296 H775 V324" class="flow data" marker-end="url(#aData)"/>
  <text x="330" y="288" fill="#3fd0ff" font-size="10.5" font-weight="600">TCP / UDP, all traffic</text>

  <!-- ===================== INTERNET ===================== -->
  <g filter="url(#soft)">
    <circle cx="1450" cy="575" r="84" fill="#131c38" stroke="url(#routerStroke)" stroke-width="1.6"/>
    <ellipse cx="1450" cy="575" rx="84" ry="30" fill="none" stroke="#3fd0ff" stroke-opacity="0.25"/>
    <ellipse cx="1450" cy="575" rx="30" ry="84" fill="none" stroke="#3fd0ff" stroke-opacity="0.25"/>
    <line x1="1366" y1="575" x2="1534" y2="575" stroke="#3fd0ff" stroke-opacity="0.25"/>
    <text x="1450" y="572" class="cardT" text-anchor="middle" font-size="18">Internet</text>
    <text x="1450" y="594" class="cardS" text-anchor="middle">VPN and proxy servers</text>
  </g>
  <path d="M1210 375 C 1280 375, 1300 520, 1360 540" class="flow vpn" marker-end="url(#aVpn)"/>
  <path d="M1210 474 C 1280 474, 1300 545, 1360 560" class="flow bak dash" marker-end="url(#aBak)"/>
  <path d="M1210 548 C 1280 548, 1300 570, 1360 578" class="flow bak dash" marker-end="url(#aBak)"/>
  <path d="M1210 622 C 1280 622, 1300 600, 1360 596" class="flow bak dash" marker-end="url(#aBak)"/>
  <path d="M1210 696 C 1280 696, 1300 630, 1360 614" class="flow bak dash" marker-end="url(#aBak)"/>

  <!-- failover callout -->
  <g filter="url(#soft)">
    <rect x="1300" y="700" width="250" height="118" rx="16" class="card" stroke="#fbbf24" stroke-opacity="0.5"/>
    <text x="1322" y="728" class="cardT" fill="#fbbf24">Failover</text>
    <text x="1322" y="751" class="cardS">When the VPN fails its probe,</text>
    <text x="1322" y="769" class="cardS">urltest moves traffic to a live</text>
    <text x="1322" y="787" class="cardS">backup and brings it back to</text>
    <text x="1322" y="805" class="cardS">AmneziaWG once it recovers.</text>
  </g>

  <!-- ===================== LEGEND ===================== -->
  <g font-size="12" fill="#9aa5c2">
    <line x1="80" y1="950" x2="112" y2="950" class="flow data"/><text x="122" y="954">client traffic</text>
    <line x1="260" y1="950" x2="292" y2="950" class="flow dns"/><text x="302" y="954">DNS</text>
    <line x1="360" y1="950" x2="392" y2="950" class="flow vpn"/><text x="402" y="954">primary path, VPN</text>
    <line x1="560" y1="950" x2="592" y2="950" class="flow bak dash"/><text x="602" y="954">backup proxies</text>
    <line x1="740" y1="950" x2="772" y2="950" class="flow ctl"/><text x="782" y="954">management and config</text>
  </g>
  <text x="1540" y="954" class="s" font-size="11.5" text-anchor="end">github.com/timofey-maykov/openwrt-hybrid-failover</text>
</svg>
</body>
</html>
